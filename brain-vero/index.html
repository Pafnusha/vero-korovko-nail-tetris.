<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#151d37"><title>Brain Vero Korovko — 100 уровней</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#f7f5ff;background:#10182d}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -20%,#384e83 0%,#192442 48%,#10182d 100%);min-height:100dvh}main{max-width:520px;margin:auto;padding:calc(15px + env(safe-area-inset-top)) 15px calc(25px + env(safe-area-inset-bottom))}header{text-align:center;margin-bottom:17px}.brand{font-size:11px;letter-spacing:3px;color:#c7c6eb;font-weight:800}h1{font-size:clamp(26px,8vw,39px);margin:7px 0 3px;letter-spacing:-1px}h1 span{color:#ffb9e1}.sub{font-size:12px;color:#abb8d6;margin:5px}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin:16px 0}.stat{border:1px solid #ffffff2b;background:#ffffff0c;border-radius:17px;padding:10px;text-align:center}.stat small{display:block;color:#aebad6;font-size:10px;letter-spacing:1px}.stat strong{font-size:22px;line-height:1.4}.progress{height:9px;background:#ffffff24;border-radius:20px;overflow:hidden}.progress div{height:100%;width:1%;background:linear-gradient(90deg,#66e4d1,#bba2ff,#ff9dcd);transition:width .4s}.meta{display:flex;justify-content:space-between;font-size:11px;color:#b4bfd9;margin:7px 2px 17px}.panel{background:linear-gradient(155deg,#293755,#1d2a47);border:1px solid #ffffff2d;border-radius:26px;padding:22px 17px;box-shadow:0 18px 35px #0004;min-height:365px}.category{font-size:12px;color:#8ee8d5;text-transform:uppercase;letter-spacing:2px;font-weight:900}.question{font-size:clamp(19px,5.5vw,27px);font-weight:850;line-height:1.32;margin:15px 0 19px;overflow-wrap:anywhere}.detail{font-size:13px;color:#c8d1e7;line-height:1.5;margin:0 0 18px}.answers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.answers button{background:linear-gradient(145deg,#43547b,#303d60);border:1px solid #8496c45e;color:white;border-radius:15px;padding:18px 8px;font-size:19px;font-weight:800;min-height:66px;box-shadow:inset 0 1px #ffffff25,0 5px 0 #101b34;transition:transform .15s,background .15s;overflow-wrap:anywhere;touch-action:manipulation}.answers button:active{transform:translateY(4px);box-shadow:inset 0 1px #ffffff25,0 1px 0 #101b34}.answers button.good{background:#187f73}.answers button.bad{background:#a43f63}.answers button:disabled{opacity:.8}.primary{background:linear-gradient(115deg,#74e2cf,#d2a2ff);color:#162340;border:0;border-radius:15px;padding:15px 20px;font-size:16px;font-weight:900;width:100%;margin-top:12px}.secondary{background:#ffffff16;color:#fff;border:1px solid #ffffff38;border-radius:12px;padding:11px 14px;font-weight:750}.tools{display:flex;gap:8px;margin:15px 0}.tools button{flex:1}.memory-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:280px;margin:18px auto}.memory-grid button{aspect-ratio:1;border-radius:16px;border:2px solid #ffffff40;background:#46587c;color:white;font-size:25px;font-weight:900}.memory-grid button.lit{background:#ffd38e;color:#1b2741;box-shadow:0 0 18px #ffce8caa}.memory-grid button.picked{background:#4ad9b9;color:#10243b}.sequence{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin:14px 0}.sequence span{border-radius:12px;padding:12px;background:#ffffff1c;min-width:45px;text-align:center;font-size:21px;font-weight:850}.feedback{min-height:27px;font-size:14px;text-align:center;color:#8ee8d5;margin:13px 0 2px;font-weight:700}.footer{text-align:center;color:#899bbd;font-size:11px;margin-top:17px}.hidden{display:none!important}.level-map{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;margin:14px 0}.level-map button{border:1px solid #ffffff25;border-radius:8px;aspect-ratio:1;background:#ffffff10;color:#aab8d2;font-size:11px;padding:0}.level-map button.done{background:#4bc8a5;color:#10273c}.level-map button.current{background:#caa8ff;color:#1c2440}.level-map button:disabled{opacity:.45}.badge{display:inline-block;background:#ffffff19;border-radius:20px;padding:8px 12px;color:#d4e0fa;font-size:12px}.result{font-size:56px;text-align:center;margin:12px 0}.countdown{text-align:center;color:#ffd99c;font-size:13px;margin:8px 0}.timer{font-size:15px;color:#ffd79a;font-weight:800;text-align:right;margin-top:-5px;margin-bottom:9px}@media(max-width:360px){.panel{padding:17px 12px}.answers button{font-size:17px}.level-map{gap:3px}}
</style></head><body><main><header><div class="brand">✌️ VERO KOROVKO PRESENTS</div><h1>🧠 BRAIN <span>VERO</span></h1><div class="sub">100 уровней для тренировки мозга</div></header><div class="stats"><div class="stat"><small>УРОВЕНЬ</small><strong id="level">1/100</strong></div><div class="stat"><small>ОЧКИ</small><strong id="score">0</strong></div><div class="stat"><small>СЕРИЯ</small><strong id="streak">0 🔥</strong></div></div><div class="progress"><div id="bar"></div></div><div class="meta"><span id="difficulty">Новичок</span><span id="completed">0% пройдено</span></div><section class="panel" id="panel"></section><div class="tools"><button class="secondary" id="sound">🔊 Звук</button><button class="secondary" id="hint">💡 Подсказка</button><button class="secondary" id="map">🗺 Уровни</button></div><div class="footer">Тренировка памяти · внимания · логики · мышления · счёта<br>Прогресс сохраняется на устройстве</div></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id),panel=$('panel');let level=1,unlocked=1,score=0,streak=0,sound=true,active=null,locked=false,timerId=null,phase='intro',hintUsed=false;const cats=['Память','Устный счёт','Закономерности','Внимание','Логика'];const emoji=['🧠','🔢','🧩','👀','💡'];const labels=['Новичок','Разминка','Сосредоточенность','Умелый','Мастер','Эксперт','Гений'];const clamp=(n,a,b)=>Math.min(b,Math.max(a,n));const rnd=(seed)=>{let x=seed|0;return()=>{x=(Math.imul(1664525,x)+1013904223)|0;return (x>>>0)/4294967296}};const choose=(a,r)=>a[Math.floor(r()*a.length)];const shuffle=(arr,r)=>{let a=[...arr];for(let i=a.length-1;i>0;i--){let j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let ctx=null;function beep(ok=true){if(!sound)return;try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;ctx??=new C();if(ctx.state==='suspended')ctx.resume().catch(()=>{});let t=ctx.currentTime,o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.setValueAtTime(ok?650:250,t);o.frequency.exponentialRampToValueAtTime(ok?980:130,t+.16);g.gain.setValueAtTime(.15,t);g.gain.exponentialRampToValueAtTime(.001,t+.2);o.connect(g).connect(ctx.destination);o.start(t);o.stop(t+.2)}catch(e){}}
function load(){try{let d=JSON.parse(localStorage.getItem('brain-vero-v1')||'{}');unlocked=clamp(Number(d.unlocked)||1,1,100);level=unlocked;score=Number(d.score)||0;streak=Number(d.streak)||0;sound=d.sound!==false}catch(e){}}function save(){try{localStorage.setItem('brain-vero-v1',JSON.stringify({unlocked,score,streak,sound}))}catch(e){}}
function hud(){ $('level').textContent=level+'/100';$('score').textContent=score;$('streak').textContent=streak+' 🔥';$('bar').style.width=(unlocked-1)+'%';$('completed').textContent=(unlocked-1)+'% пройдено';$('difficulty').textContent=labels[Math.min(6,Math.floor((level-1)/15))];$('sound').textContent=sound?'🔊 Звук':'🔇 Звук';$('hint').disabled=phase!=='question'||hintUsed;$('map').disabled=phase==='memory-show'||phase==='memory-input'}
function stop(){if(timerId){clearInterval(timerId);clearTimeout(timerId);timerId=null}}
function header(type,title,detail=''){return '<div class="category">'+escape(type)+'</div><div class="question">'+escape(title)+'</div>'+(detail?'<p class="detail">'+escape(detail)+'</p>':'')}
function opts(correct,wrong,r){let a=shuffle([correct,...wrong.filter(v=>String(v)!==String(correct)).slice(0,3)],r);return a.map(v=>String(v))}
function uniqueNumbers(correct,r,spread=12){let vals=new Set([correct]);let count=0;while(vals.size<4&&count++<100){let n=correct+(Math.floor(r()*(spread*2+1))-spread);if(n>=0)vals.add(n)}return [...vals].filter(v=>v!==correct).slice(0,3)}
function task(n){const r=rnd(n*97531+451),tier=Math.floor((n-1)/20),type=(n-1)%5;let t={type,category:cats[type],emoji:emoji[type],n,answer:null,choices:[],hint:'',detail:''};
if(type===0){let length=3+tier+Math.floor((n-1)%20/10);let seq=Array.from({length},()=>Math.floor(r()*9));t.sequence=seq;t.hint='Запоминай по три элемента за раз';t.detail='Запомни порядок подсвеченных клеток. Затем повтори его.';return t}
if(type===1){let a=3+Math.floor(r()*(10+tier*13)),b=2+Math.floor(r()*(8+tier*9)),mode=(Math.floor(n/5)+tier)%4;if(mode===0){t.title=a+' + '+b+' = ?';t.answer=a+b;t.hint='Сложи десятки, затем единицы'}else if(mode===1){t.title=(a+b)+' − '+b+' = ?';t.answer=a;t.hint='Проверь ответ обратным сложением'}else if(mode===2){a=2+Math.floor(r()*(6+tier*2));b=2+Math.floor(r()*(6+tier*2));t.title=a+' × '+b+' = ?';t.answer=a*b;t.hint='Разбей умножение на удобные части'}else{a=2+Math.floor(r()*(6+tier*2));b=2+Math.floor(r()*(6+tier*2));t.title=(a*b)+' ÷ '+a+' = ?';t.answer=b;t.hint='Вспомни таблицу умножения'}t.choices=opts(t.answer,uniqueNumbers(t.answer,r,Math.max(8,tier*10+8)),r);return t}
if(type===2){let a=1+Math.floor(r()*12),d=2+Math.floor(r()*(5+tier*4)),mode=Math.floor(n/5)%3,seq;if(mode===0){seq=Array.from({length:5},(_,i)=>a+i*d);t.answer=a+5*d;t.hint='Каждый следующий элемент увеличивается на одинаковое число'}else if(mode===1){let k=2+Math.floor(r()*3);seq=Array.from({length:5},(_,i)=>a+i*i*k);t.answer=a+25*k;t.hint='Разности между соседними числами возрастают равномерно'}else{a=1+Math.floor(r()*4);let mult=2+(tier>=3?1:0);seq=Array.from({length:5},(_,i)=>a*Math.pow(mult,i));t.answer=a*Math.pow(mult,5);t.hint='Проверь, во сколько раз увеличивается число'}t.title=seq.join('  ·  ')+'  ·  ?';t.choices=opts(t.answer,uniqueNumbers(t.answer,r,Math.max(12,d*5)),r);return t}
if(type===3){let symbols=['◆','●','▲','★','♥','✿','⬟','⬢'],special=choose(symbols,r),normal=choose(symbols.filter(x=>x!==special),r),count=9+tier*3+Math.floor(r()*5),index=Math.floor(r()*count);t.grid=Array.from({length:count},(_,i)=>i===index?special:normal);t.answer=index;t.title='Найди отличающийся символ';t.hint='Просматривай строки последовательно';return t}
let kind=Math.floor(n/5)%4;if(kind===0){let all=3+Math.floor(r()*(8+tier*3)),red=1+Math.floor(r()*(all-1));t.title='В коробке '+all+' шариков, из них '+red+' красных. Сколько НЕ красных?';t.answer=all-red;t.hint='Вычти красные шарики из общего количества'}else if(kind===1){let a=2+Math.floor(r()*8),b=1+Math.floor(r()*8);t.title='У Веры '+a+' книг, у Лены на '+b+' больше. Сколько книг у них вместе?';t.answer=2*a+b;t.hint='Сначала найди число книг у Лены'}else if(kind===2){let a=2+Math.floor(r()*7),b=2+Math.floor(r()*6);t.title='На '+a+' столах по '+b+' свечи. '+(tier>1?'Погасли '+a+' свечей. Сколько горит?':'Сколько всего свечей?');t.answer=tier>1?a*b-a:a*b;t.hint='Умножь число столов на число свечей'}else{let start=2+Math.floor(r()*8),step=2+Math.floor(r()*6),h=2+tier;t.title='Робот проходит '+step+' клетки за ход. Он стоит на клетке '+start+'. Где будет через '+h+' ходов?';t.answer=start+step*h;t.hint='Умножь длину шага на количество ходов'}t.choices=opts(t.answer,uniqueNumbers(t.answer,r,12+tier*7),r);return t}
function choices(t){return '<div class="answers">'+t.choices.map((v,i)=>'<button data-option="'+i+'">'+escape(v)+'</button>').join('')+'</div>'}
function showIntro(){phase='intro';stop();panel.innerHTML=header('100 испытаний','🧠 Brain Vero Korovko','Пять тренировок: память, счёт, закономерности, внимание и логика. Каждый пятый уровень — новый тип задачи. Проходи уровни последовательно, без ограничений по времени.')+'<div class="badge">Прогресс: '+(unlocked-1)+' из 100 уровней</div><button class="primary" id="go">▶ '+(unlocked>1?'Продолжить с уровня '+unlocked:'Начать тренировку')+'</button>';$('go').onclick=()=>{level=unlocked;showTask()};hud()}
function showTask(){stop();hintUsed=false;locked=false;active=task(level);let t=active;phase='question';if(t.type===0){phase='memory-show';panel.innerHTML=header(t.emoji+' '+t.category,'Запомни последовательность',t.detail)+'<div class="memory-grid">'+Array.from({length:9},(_,i)=>'<button disabled data-cell="'+i+'">'+(i+1)+'</button>').join('')+'</div><div class="countdown" id="countdown">Смотри внимательно...</div>';hud();memoryShow(t);return}
if(t.type===3){panel.innerHTML=header(t.emoji+' '+t.category,t.title,'Найди единственный символ, который отличается от остальных.')+'<div class="memory-grid">'+t.grid.map((v,i)=>'<button data-spot="'+i+'">'+v+'</button>').join('')+'</div><div class="feedback" id="feedback"></div>';panel.querySelectorAll('[data-spot]').forEach(b=>b.onclick=()=>answer(Number(b.dataset.spot)===t.answer,b));}
else{panel.innerHTML=header(t.emoji+' '+t.category,t.title,'Выбери правильный ответ.')+choices(t)+'<div class="feedback" id="feedback"></div>';panel.querySelectorAll('[data-option]').forEach(b=>b.onclick=()=>answer(Number(b.textContent)===t.answer,b))}
hud()}
async function memoryShow(t){const token=t;let cells=[...panel.querySelectorAll('[data-cell]')];for(let i=0;i<t.sequence.length;i++){if(active!==token||phase!=='memory-show')return;await new Promise(r=>setTimeout(r,400));if(active!==token||phase!=='memory-show')return;cells[t.sequence[i]].classList.add('lit');beep(true);await new Promise(r=>setTimeout(r,Math.max(340,750-Math.floor((level-1)/20)*60)));if(active!==token||phase!=='memory-show')return;cells[t.sequence[i]].classList.remove('lit')}if(active!==token||phase!=='memory-show')return;phase='memory-input';t.input=[];panel.innerHTML=header('🧠 Память','Повтори порядок','Нажимай клетки в той же последовательности. '+t.sequence.length+' нажатий.')+'<div class="memory-grid">'+Array.from({length:9},(_,i)=>'<button data-cell="'+i+'">'+(i+1)+'</button>').join('')+'</div><div class="countdown" id="countdown">0 / '+t.sequence.length+'</div>';panel.querySelectorAll('[data-cell]').forEach(b=>b.onclick=()=>{if(locked)return;let i=Number(b.dataset.cell),p=t.input.length;t.input.push(i);b.classList.add('picked');setTimeout(()=>b.classList.remove('picked'),180);if(i!==t.sequence[p]){answer(false,b);return}beep(true);$('countdown').textContent=t.input.length+' / '+t.sequence.length;if(t.input.length===t.sequence.length)answer(true,b)});hud()}
function answer(ok,b){if(locked)return;locked=true;phase='result';if(b)b.classList.add(ok?'good':'bad');if(ok){let gain=Math.max(30,110+Math.floor(level/10)*10-(hintUsed?40:0));score+=gain;streak++;beep(true);if(level===unlocked&&unlocked<100)unlocked++;save();panel.innerHTML='<div class="category">ПРАВИЛЬНО!</div><div class="result">🎉</div><div class="question" style="text-align:center">+'+gain+' очков</div><p class="detail" style="text-align:center">Уровень '+level+' пройден. Серия: '+streak+'.</p><button class="primary" id="next">'+(level===100?'🏆 Завершить игру':'▶ Следующий уровень')+'</button>';$('next').onclick=()=>{if(level===100){win();return}level++;showTask()}}else{streak=0;beep(false);save();panel.innerHTML='<div class="category">ЕЩЁ ОДНА ПОПЫТКА</div><div class="result">🧠</div><div class="question" style="text-align:center">Попробуй снова</div><p class="detail" style="text-align:center">Ошибки помогают учиться. Повтори задание и найди решение.</p><button class="primary" id="retry">↻ Повторить уровень</button>';$('retry').onclick=showTask}hud()}
function win(){phase='win';panel.innerHTML=header('🏆 ФИНИШ','Все 100 уровней пройдены!','Поздравляем! Ты завершил полный марафон Brain Vero Korovko.')+'<div class="result">👑</div><div class="badge">Всего очков: '+score+'</div><button class="primary" id="again">↻ Пройти заново</button>';$('again').onclick=()=>{level=1;showTask()};hud()}
function map(){if(phase==='memory-show'||phase==='memory-input')return;phase='map';stop();panel.innerHTML=header('КАРТА ИГРЫ','100 уровней','Открытые уровни можно переигрывать. Прогресс прохождения сохраняется.')+'<div class="level-map">'+Array.from({length:100},(_,i)=>'<button data-level="'+(i+1)+'" class="'+(i+1<unlocked?'done':i+1===unlocked?'current':'')+'" '+(i+1>unlocked?'disabled':'')+'>'+(i+1)+'</button>').join('')+'</div><button class="primary" id="back">▶ Продолжить</button>';panel.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>{level=+b.dataset.level;showTask()});$('back').onclick=()=>{level=unlocked;showTask()};hud()}
$('sound').onclick=()=>{sound=!sound;save();if(sound)beep(true);hud()};$('hint').onclick=()=>{if(phase!=='question'||hintUsed||!active)return;hintUsed=true;let p=panel.querySelector('.detail');if(p)p.textContent='💡 '+active.hint;hud()};$('map').onclick=map;load();showIntro();
})();
</script></body></html>
