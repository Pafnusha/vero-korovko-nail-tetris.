<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#39255c"><title>СЛОВА VERO — Собери слово</title><style>*{box-sizing:border-box}body{margin:0;min-height:100dvh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at 50% -10%,#8b67b8,#40295e 53%,#201c3e);color:white}.app{max-width:490px;margin:auto;padding:calc(22px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));text-align:center}a.back{display:inline-block;color:#e6d4ff;text-decoration:none;font-size:13px;margin-bottom:15px}h1{font-size:clamp(30px,8vw,40px);margin:8px 0 5px;letter-spacing:-1px}.sub{color:#e2cffa;font-size:13px;margin:0 0 19px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#ffffff17;border:1px solid #ffffff32;border-radius:14px;padding:10px 5px}.stat small{display:block;color:#d4c5e7;font-size:10px}.stat b{font-size:22px}.bar{height:8px;border-radius:20px;background:#ffffff2b;margin:14px 0 20px;overflow:hidden}.bar div{height:100%;background:linear-gradient(90deg,#f7bbd9,#ffde8b);transition:width .3s}.panel{background:linear-gradient(145deg,#ffffff2b,#ffffff10);border:1px solid #ffffff50;box-shadow:0 18px 35px #0005,inset 0 2px #ffffff30;border-radius:25px;padding:24px 14px;min-height:350px}.hint{font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:#fbd6e9;font-weight:800}.question{font-size:21px;font-weight:850;margin:14px 0 7px}.explain{font-size:13px;color:#ded3eb;line-height:1.5;margin:8px 0 18px}.slots{display:flex;justify-content:center;gap:5px;flex-wrap:wrap;min-height:55px;margin:20px 0 23px}.slot{width:clamp(31px,8vw,45px);height:49px;border-radius:11px;background:#ffffff20;border:2px solid #ffffff45;display:grid;place-items:center;font-size:23px;font-weight:950;box-shadow:inset 0 -3px #0002;cursor:pointer}.slot.filled{background:#f9d5ed;color:#3d2a5b;border-color:#fff}.letters{display:flex;justify-content:center;flex-wrap:wrap;gap:9px;margin:0 auto 21px;max-width:380px}.letter{width:clamp(47px,13vw,61px);height:58px;border-radius:15px;border:1px solid #fff8;background:linear-gradient(145deg,#fff8dc,#f7b5db);color:#493052;font-size:25px;font-weight:950;box-shadow:0 6px 0 #a76b9d,0 10px 13px #0005;touch-action:manipulation}.letter:active{transform:translateY(5px);box-shadow:0 1px 0 #a76b9d}.letter:disabled{opacity:.2;box-shadow:none}.actions{display:flex;gap:9px}.actions button,.primary{border:1px solid #ffffff40;background:#ffffff20;border-radius:13px;padding:13px;color:white;font-weight:800;font-size:14px;flex:1}.primary{background:linear-gradient(145deg,#ffe1a9,#f6a9d9);color:#452b56;border:0;box-shadow:0 5px 0 #a66b94;width:100%;margin-top:12px;font-size:17px}.message{font-weight:850;min-height:23px;margin:11px 0;color:#ffe6a5}.celebrate{font-size:72px;margin:18px}.bottom{font-size:11px;color:#d7c6e9;margin-top:20px}.hidden{display:none!important}@media(max-width:360px){.panel{padding:19px 10px}.letters{gap:7px}.letter{width:43px;height:53px}}</style></head><body><main class="app"><a class="back" href="../index.html">← Все игры VERO KOROVKO</a><h1>🔤 СЛОВА VERO</h1><p class="sub">Собери слово из букв · 60 уровней</p><div class="stats"><div class="stat"><small>УРОВЕНЬ</small><b id="level">1/60</b></div><div class="stat"><small>ОЧКИ</small><b id="score">0</b></div><div class="stat"><small>ПОДСКАЗКИ</small><b id="helps">3</b></div></div><div class="bar"><div id="progress"></div></div><section class="panel" id="panel"></section><div class="bottom">Нажимай на буквы, чтобы составить слово. Прогресс сохраняется на устройстве.</div></main><script>
(()=>{'use strict';const words=[
['КОТ','Домашний пушистый питомец'],['ДОМ','В нём живут люди'],['ЛЕС','Много деревьев вместе'],['МИР','Противоположность войне'],['СОН','Что мы видим ночью'],['СЫР','Молочный продукт'],['МЯЧ','Им играют в футбол'],['САД','Место с плодовыми деревьями'],['НОС','Часть лица для обоняния'],['ЛУК','Овощ, от которого плачут'],
['РОЗА','Цветок с шипами'],['РЕКА','Течёт к морю'],['ЗИМА','Холодное время года'],['ЛЕТО','Самое тёплое время года'],['РЫБА','Плавает под водой'],['КНИГА','Её читают'],['СЛОВО','Состоит из букв'],['ВЕТЕР','Движение воздуха'],['МОРЕ','Большой солёный водоём'],['ЗВУК','Его слышат ушами'],
['КОШКА','Мурлыкающий питомец'],['СОБАКА','Верный четвероногий друг'],['ПТИЦА','Животное с перьями'],['ОБЛАКО','Плывёт по небу'],['ЗЕРКАЛО','Показывает отражение'],['МОЛОКО','Белый напиток от коровы'],['ЯБЛОКО','Круглый фрукт'],['РАДУГА','Разноцветная дуга в небе'],['ГИТАРА','Музыкальный инструмент со струнами'],['ПЛАНЕТА','Земля — одна из них'],
['МАНИКЮР','Уход за ногтями рук'],['ПЕДИКЮР','Уход за ногтями ног'],['КРАСОТА','То, что радует глаз'],['УЛЫБКА','Выражение радости на лице'],['ПОДАРОК','То, что дарят на праздник'],['ФАНТАЗИЯ','Воображение'],['ЗАГАДКА','Вопрос с неочевидным ответом'],['ПРИРОДА','Леса, реки, горы и всё живое'],['ПРАЗДНИК','Особенный радостный день'],['МЕЛОДИЯ','Последовательность музыкальных звуков'],
['КОСМОС','Пространство за пределами Земли'],['ЗВЕЗДА','Светит на ночном небе'],['КОМЕТА','Небесное тело с хвостом'],['РАКЕТА','Летает в космос'],['СПУТНИК','Обращается вокруг планеты'],['ТЕЛЕСКОП','Прибор для наблюдения за звёздами'],['ГАЛАКТИКА','Огромная система звёзд'],['АСТРОНАВТ','Человек, который летает в космос'],['ОРБИТА','Путь небесного тела'],['ВСЕЛЕННАЯ','Всё существующее пространство'],
['ШОКОЛАД','Сладость из какао'],['КАРАМЕЛЬ','Сладость из нагретого сахара'],['АПЕЛЬСИН','Оранжевый цитрус'],['КЛУБНИКА','Красная ароматная ягода'],['МОРОЖЕНОЕ','Холодный сладкий десерт'],['ПИРОЖНОЕ','Небольшой сладкий десерт'],['ЛИМОНАД','Сладкий прохладительный напиток'],['МАРМЕЛАД','Желейная сладость'],['ЧЕРНИКА','Тёмно-синяя лесная ягода'],['ВИНОГРАД','Ягоды, растущие гроздьями']
];const $=id=>document.getElementById(id),panel=$('panel');let unlocked=1,level=1,score=0,helps=3,selected=[],tiles=[],locked=false;function rand(seed){let x=seed|0;return()=>{x=(Math.imul(x,1664525)+1013904223)|0;return(x>>>0)/4294967296}}function shuffled(w,n){let r=rand(n*17417+231);let a=[...w].map((c,i)=>({c,i}));for(let i=a.length-1;i>0;i--){let j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}if(a.map(x=>x.c).join('')===w&&a.length>1)[a[0],a[1]]=[a[1],a[0]];return a}function load(){try{let d=JSON.parse(localStorage.getItem('vero-words-v1')||'{}');unlocked=Math.max(1,Math.min(60,Number(d.unlocked)||1));score=Number(d.score)||0;helps=Math.max(0,Number.isFinite(Number(d.helps))?Number(d.helps):3)}catch(e){}level=unlocked}function save(){try{localStorage.setItem('vero-words-v1',JSON.stringify({unlocked,score,helps}))}catch(e){}}function hud(){$('level').textContent=level+'/60';$('score').textContent=score;$('helps').textContent=helps;$('progress').style.width=((unlocked-1)/60*100)+'%'}function current(){return words[level-1]}function render(){let [word,clue]=current();locked=false;selected=[];tiles=shuffled(word,level);panel.innerHTML='<div class="hint">Уровень '+level+'</div><div class="question">Составь слово</div><div class="explain">💡 '+clue+'</div><div class="slots" id="slots"></div><div class="letters" id="letters"></div><div class="message" id="message"></div><div class="actions"><button id="clear">↺ Сбросить</button><button id="help">✨ Подсказка</button></div>';draw();$('clear').onclick=()=>{selected=[];draw()};$('help').onclick=help;hud()}function draw(){let word=current()[0];$('slots').innerHTML=Array.from({length:word.length},(_,i)=>'<div class="slot '+(i<selected.length?'filled':'')+'" data-slot="'+i+'">'+(i<selected.length?tiles[selected[i]].c:'')+'</div>').join('');$('letters').innerHTML=tiles.map((x,i)=>'<button class="letter" data-i="'+i+'" '+(selected.includes(i)?'disabled':'')+'>'+x.c+'</button>').join('');document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>pick(Number(b.dataset.i)));document.querySelectorAll('[data-slot]').forEach(b=>b.onclick=()=>{let i=Number(b.dataset.slot);if(i<selected.length){selected.splice(i,1);draw()}});$('help').disabled=helps<1}function pick(i){if(locked||selected.includes(i))return;selected.push(i);draw();let word=current()[0];if(selected.length===word.length){let attempt=selected.map(j=>tiles[j].c).join('');if(attempt===word){locked=true;let gain=word.length*20;score+=gain;if(level===unlocked&&unlocked<60)unlocked++;if(level%5===0)helps++;save();hud();panel.innerHTML='<div class="hint">ПРАВИЛЬНО!</div><div class="celebrate">🎉</div><div class="question">'+word+'</div><div class="explain">+'+gain+' очков'+(level%5===0?' · +1 подсказка':'')+'</div><button class="primary" id="next">'+(level===60?'🏆 Завершить':'▶ Следующее слово')+'</button>';$('next').onclick=()=>{if(level===60){finish();return}level++;render()}}else{$('message').textContent='Пока не получилось — попробуй ещё!';setTimeout(()=>{if(!locked&&selected.length===word.length){selected=[];draw();$('message').textContent=''}},850)}}}function help(){if(helps<1||locked)return;let word=current()[0],position=selected.length;if(position>=word.length)return;let required=word[position];let available=tiles.findIndex((t,i)=>t.c===required&&!selected.includes(i));if(available<0)return;helps--;save();hud();pick(available)}function finish(){panel.innerHTML='<div class="hint">ПОБЕДА!</div><div class="celebrate">🏆</div><div class="question">Все 60 слов собраны!</div><div class="explain">Твои очки: '+score+'</div><button class="primary" id="again">↻ Начать заново</button>';$('again').onclick=()=>{level=1;render()}}load();render()})();
</script></body></html>
